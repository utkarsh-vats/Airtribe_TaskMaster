name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET }}
      UPLOAD_DIR: ./tmp/test-uploads
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: taskmaster
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://taskmaster:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/taskmaster_test

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: taskmaster
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: taskmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmaster -d taskmaster_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm test
